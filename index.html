<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { font-family: 'Geist', system-ui, sans-serif; background: #06080f; color: #e9e4d6; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  ::selection { background: #f6b042; color: #1a1100; }
  .__boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #06080f; color: #e9e4d6; z-index: 0;
    font-family: 'Newsreader', serif; font-style: italic; font-size: 22px;
  }
  .__boot::after {
    content: ''; position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%);
    width: 80px; height: 1px; background: rgba(246,176,66,0.6);
    animation: bootBar 1.2s ease-in-out infinite alternate;
  }
  @keyframes bootBar { from { width: 30px; } to { width: 120px; } }
  body.ready .__boot { display: none !important; }
</style>

<script type="text/babel" data-presets="react">
  function App() {
    React.useEffect(() => {
      document.body.classList.add('ready');
      const boot = document.querySelector('.__boot');
      if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
    }, []);
    return <QuantLab />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
